[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymemchat"
version = "0.2.0"
description = "A lightweight, self-hosted chatbot with semantic memory."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langchain-core>=0.3",
  "langchain-community>=0.3",
  "langchain-openai>=0.2",
  "mem0ai>=0.1",
  "openai>=1.30",
  "rich>=13.0",
  "typer>=0.12",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
